name: Test Python GIS engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/python-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/python-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e './engine[test]'
      - name: Lint
        run: ruff check engine/src engine/tests
      - name: Test
        run: pytest engine/tests
